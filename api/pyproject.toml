[project]
name = "voxfin-api"
version = "2.0.0"
description = "VoxFin V2 API: voice-first personal finance tracker"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "argon2-cffi>=23.1",
  "httpx>=0.28",
  "python-multipart>=0.0.9",
  "email-validator>=2.1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx2",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]
