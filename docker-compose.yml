# Local development / self-hosting: docker compose up --build → http://localhost:8000
# Production runs on Render + Neon instead (see render.yaml and docs/DEPLOY.md).
name: voxfin

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: voxfin
      POSTGRES_USER: voxfin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # localhost only, for running the API outside Docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxfin -d voxfin"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://voxfin:${POSTGRES_PASSWORD}@db:5432/voxfin
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: voxfin
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: voxfin
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./ops/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
